[package]
name = "zabeta"
version = "0.1.0"
description = "Zabeta - Workforce Operations Platform"
authors = []
edition = "2021"

[lib]
name = "zabeta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "zabeta"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
screenshots = "0.8"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
